name: PC-Kontrolle APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Android SDK Komponenten installieren
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Projekt-ZIP finden und entpacken
        run: |
          mkdir -p android-project

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "FEHLER: Keine Projekt-ZIP gefunden."
            exit 1
          fi

          echo "Gefundene ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d android-project

      - name: Android-Projekt finden
        run: |
          PROJECT_DIR=$(find android-project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "FEHLER: Kein Android-Projekt gefunden."
            find android-project -maxdepth 4 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android-Projekt gefunden: $PROJECT_DIR"

      - name: Gradle installieren
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip

      - name: APK bauen
        run: |
          cd "$PROJECT_DIR"
          ../../gradle-8.9/bin/gradle assembleDebug --no-daemon

      - name: APK als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: PC-Kontrolle-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
