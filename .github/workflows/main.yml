name: PC-Kontrolle APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Projekt-ZIP finden
        shell: bash
        run: |
          ZIP_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "FEHLER: Keine Projekt-ZIP gefunden."
            exit 1
          fi

          echo "Gefundene ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Projekt entpacken
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/android-project"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/android-project"

      - name: Android-Projekt finden
        shell: bash
        run: |
          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/android-project" -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "FEHLER: Kein Android-Projekt gefunden."
            find "$GITHUB_WORKSPACE/android-project" -maxdepth 5 -type f | head -100
            exit 1
          fi

          echo "Android-Projekt gefunden: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: APK bauen
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: PC-Kontrolle-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
