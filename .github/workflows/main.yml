name: PC-Kontrolle APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Projekt-ZIP finden
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "FEHLER: Keine Projekt-ZIP gefunden."
            exit 1
          fi

          echo "Gefundene ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Projekt entpacken
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/android-project"
          mkdir -p "$GITHUB_WORKSPACE/android-project"

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/android-project"

          echo "Projekt entpackt."

      - name: Android-Projekt finden
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/android-project" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "FEHLER: Kein Android-Gradle-Projekt gefunden."
            echo ""
            echo "Gefundene Dateien:"
            find "$GITHUB_WORKSPACE/android-project" -maxdepth 6 -type f | head -150
            exit 1
          fi

          echo "Android-Projekt gefunden:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: JVM-Ziele auf Java 17 setzen
        shell: bash
        run: |
          set -e

          cat > "$GITHUB_WORKSPACE/force-java17.gradle" <<'EOF'
          import org.gradle.api.tasks.compile.JavaCompile

          allprojects {
              tasks.configureEach { task ->

                  if (task instanceof JavaCompile) {
                      task.options.release = 17
                  }

                  if (task.class.name.contains("KotlinCompile")) {
                      try {
                          task.kotlinOptions.jvmTarget = "17"
                      } catch (Exception ignored) {
                          println("Kotlin-JVM-Target konnte nicht direkt gesetzt werden: " + task.path)
                      }
                  }
              }
          }

          gradle.projectsEvaluated {
              allprojects {
                  tasks.configureEach { task ->

                      if (task instanceof JavaCompile) {
                          task.options.release = 17
                      }

                      if (task.class.name.contains("KotlinCompile")) {
                          try {
                              task.kotlinOptions.jvmTarget = "17"
                          } catch (Exception ignored) {
                              println("Kotlin-JVM-Target konnte nach Projektkonfiguration nicht gesetzt werden: " + task.path)
                          }
                      }
                  }
              }
          }
          EOF

          echo "Java/Kotlin JVM-Konfiguration erstellt."

      - name: Gradle-Dateien prüfen
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== Projektdateien ==="
          ls -la

          echo ""
          echo "=== Gradle-Dateien ==="
          find . -maxdepth 3 -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print

      - name: APK bauen
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "================================"
          echo "PC-Kontrolle APK wird gebaut"
          echo "Java: 17"
          echo "Kotlin JVM Target: 17"
          echo "================================"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug \
              --no-daemon \
              --stacktrace \
              --init-script "$GITHUB_WORKSPACE/force-java17.gradle"
          else
            gradle assembleDebug \
              --no-daemon \
              --stacktrace \
              --init-script "$GITHUB_WORKSPACE/force-java17.gradle"
          fi

      - name: APK suchen
        shell: bash
        run: |
          set -e

          echo "=== APK-Dateien ==="

          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print

          APK_COUNT=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "FEHLER: Keine APK gefunden."
            exit 1
          fi

          echo ""
          echo "APK erfolgreich erzeugt."

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: PC-Kontrolle-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
