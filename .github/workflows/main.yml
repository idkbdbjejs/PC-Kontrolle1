name: PC-Kontrolle APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Projekt-ZIP finden
        shell: bash
        run: |
          ZIP_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "FEHLER: Keine Projekt-ZIP gefunden."
            exit 1
          fi

          echo "Gefundene ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Projekt entpacken
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/android-project"
          mkdir -p "$GITHUB_WORKSPACE/android-project"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/android-project"

          echo "Projekt wurde entpackt."

      - name: Android-Projekt finden
        shell: bash
        run: |
          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/android-project" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "FEHLER: Kein Android-Projekt gefunden."

            echo "Gefundene Dateien:"
            find "$GITHUB_WORKSPACE/android-project" \
              -maxdepth 6 \
              -type f | head -200

            exit 1
          fi

          echo "Android-Projekt:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Java-Einstellungen reparieren
        shell: bash
        run: |
          python3 <<'PY'
          import os
          import re

          project = os.environ["PROJECT_DIR"]

          gradle_files = []

          for root, dirs, files in os.walk(project):
              for file in files:
                  if file in ("build.gradle", "build.gradle.kts"):
                      gradle_files.append(os.path.join(root, file))

          print("Gefundene Gradle-Dateien:")
          for f in gradle_files:
              print(f)

          for path in gradle_files:
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()

              original = content

              # Entfernt Java --release Einstellungen,
              # die vom Android Gradle Plugin nicht unterstützt werden.
              content = re.sub(
                  r'^[ \t]*options\.release\s*=\s*[^\n]*\n?',
                  '',
                  content,
                  flags=re.MULTILINE
              )

              content = re.sub(
                  r'^[ \t]*options\.release\.set\([^)]*\)\s*\n?',
                  '',
                  content,
                  flags=re.MULTILINE
              )

              # Android compileOptions ergänzen,
              # falls das Projekt noch keine besitzt.
              if re.search(r'\bcompileOptions\s*\{', content) is None:
                  android_match = re.search(
                      r'(\bandroid\s*\{)',
                      content
                  )

                  if android_match:
                      insert_at = android_match.end()

                      compile_options = """

                  compileOptions {
                      sourceCompatibility JavaVersion.VERSION_17
                      targetCompatibility JavaVersion.VERSION_17
                  }
              """

                      content = (
                          content[:insert_at]
                          + compile_options
                          + content[insert_at:]
                      )

              if content != original:
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)

                  print("Repariert:", path)
              else:
                  print("Keine Änderung nötig:", path)

          PY

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v6

      - name: Gradle-Version prüfen
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --version
          else
            gradle --version
          fi

      - name: APK bauen
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: APK suchen
        shell: bash
        run: |
          echo "Gebautes APK:"
          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: PC-Kontrolle-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
