name: PC-Kontrolle APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: ZIP finden
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -iname "*.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "FEHLER: Keine ZIP-Datei gefunden."
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Android-Projekt entpacken
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/android-project"

          mkdir -p "$GITHUB_WORKSPACE/android-project"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/android-project"

      - name: Android-Projekt finden
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find \
            "$GITHUB_WORKSPACE/android-project" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "FEHLER: Android-Projekt nicht gefunden."
            exit 1
          fi

          echo "Projekt:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Android Gradle Dateien reparieren
        shell: bash
        run: |
          set -e

          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "FEHLER: $APP_GRADLE nicht gefunden."
            exit 1
          fi

          echo "Repariere:"
          echo "$APP_GRADLE"

          python3 - "$APP_GRADLE" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          # Falsche Groovy-Syntax entfernen.
          text = re.sub(
              r'(?m)^[ \t]*sourceCompatibility\s+JavaVersion\.VERSION_17\s*$',
              '',
              text
          )

          text = re.sub(
              r'(?m)^[ \t]*targetCompatibility\s+JavaVersion\.VERSION_17\s*$',
              '',
              text
          )

          # Falsche --release Einstellungen entfernen.
          text = re.sub(
              r'(?m)^[ \t]*options\.release\s*=\s*.*$',
              '',
              text
          )

          text = re.sub(
              r'(?m)^[ \t]*options\.release\.set\(.*\)\s*$',
              '',
              text
          )

          # Vorhandene compileOptions entfernen,
          # damit wir genau eine saubere Version einsetzen.
          text = re.sub(
              r'(?s)\s*compileOptions\s*\{.*?\n\s*\}',
              '',
              text,
              count=1
          )

          # Saubere Kotlin-DSL-Version.
          block = """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """

          android_match = re.search(
              r'(\bandroid\s*\{)',
              text
          )

          if not android_match:
              raise SystemExit(
                  "FEHLER: Kein android { ... } Block gefunden."
              )

          position = android_match.end()

          text = (
              text[:position]
              + block
              + text[position:]
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("build.gradle.kts wurde repariert.")
          PY

          echo ""
          echo "===== REPARIERTE build.gradle.kts ====="
          cat "$APP_GRADLE"
          echo "========================================"

      - name: Gradle 8.11.1 installieren
        shell: bash
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/gradle"

          curl -L \
            -o "$RUNNER_TEMP/gradle/gradle.zip" \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip

          unzip -q \
            "$RUNNER_TEMP/gradle/gradle.zip" \
            -d "$RUNNER_TEMP/gradle"

          echo "$RUNNER_TEMP/gradle/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Gradle Version prüfen
        shell: bash
        run: |
          gradle --version

      - name: APK bauen
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: APK suchen
        shell: bash
        run: |
          set -e

          echo "Gefundene APK-Dateien:"

          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "FEHLER: APK wurde nicht erzeugt."
            exit 1
          fi

          echo "APK ERFOLGREICH ERZEUGT:"
          echo "$APK"

      - name: APK als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: PC-Kontrolle-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
